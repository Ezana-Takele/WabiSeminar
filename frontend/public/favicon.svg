<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Eyeglasses Group -->
  <g transform="translate(0, 0)">
    <!-- Temple arms (outer sides) -->
    <path d="M6 29 C9 29 11 31 13 32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 29 C55 29 53 31 51 32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Lens Frame -->
    <rect x="12" y="24" width="17" height="17" rx="6" fill="url(#lensGrad)" stroke="#ffffff" stroke-width="3.2"/>
    
    <!-- Right Lens Frame -->
    <rect x="35" y="24" width="17" height="17" rx="6" fill="url(#lensGrad)" stroke="#ffffff" stroke-width="3.2"/>

    <!-- Center Bridge -->
    <path d="M29 30 C31.5 27 32.5 27 35 30" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Lens Reflections / Glare -->
    <path d="M15 28 L23 28" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
    <path d="M38 28 L46 28" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>